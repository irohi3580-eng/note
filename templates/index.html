<!DOCTYPE html>
<html>
<head>
  <title>メモ一覧</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- ナビバー -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">メモアプリ</span>
  <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container mt-5">

  <h2 class="mb-4">メモ一覧</h2>

  <!-- 入力フォーム -->
  <form method="post" action="/add" class="input-group mb-4">
    <input name="content" class="form-control" placeholder="メモを書く">
    <button class="btn btn-primary">追加</button>
  </form>

  <!-- メモ一覧 -->
  <div class="row">
    {% for memo in memos %}
      <div class="col-md-4 mb-3">
        <div class="card memo-card shadow-sm">

          <div class="card-body">
            <p class="card-text">{{ memo["content"] }}</p>

            <div class="d-flex justify-content-end">
              <a href="/edit/{{ memo['id'] }}" class="btn btn-warning btn-sm me-2">編集</a>
              <a href="/delete/{{ memo['id'] }}" class="btn btn-danger btn-sm"
                 onclick="return confirm('削除しますか？')">削除</a>
            </div>

          </div>

        </div>
      </div>
    {% endfor %}
  </div>

</div>

</body>
</html>
