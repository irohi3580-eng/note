<!DOCTYPE html>
<html>
<head>
  <title>編集</title>

</head>

<body class="bg-light">
<div class="container mt-5">

  <h1 class="mb-4">メモ編集</h1>

  <form method="post" action="/update/{{ memo['id'] }}">

  </form>

  <a href="/" class="btn btn-secondary mt-3">戻る</a>

</div>
</body>
</html>
