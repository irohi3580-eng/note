<!DOCTYPE html>
<html>
<head>
  <title>ログイン</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light d-flex align-items-center" style="height:100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-body">

          <h3 class="text-center mb-4">ログイン</h3>

          {% if error %}
          <div class="alert alert-danger text-center shake">
            {{ error }}
          </div>
          {% endif %}

          <form method="post">

            <div class="mb-3">
              <input name="username" class="form-control" placeholder="ユーザー名" value="{{ request.form.username }}">
            </div>

            <div class="mb-3">
              <input name="password" type="password" class="form-control" placeholder="パスワード">
            </div>

            <button class="btn btn-primary w-100">ログイン</button>
          </form>

          <div class="text-center mt-3">
            <a href="/register">新規登録はこちら</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
